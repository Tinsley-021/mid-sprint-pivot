<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Retail Inventory & Payment System</title>

  <style>
body {
  font-family: Arial, sans-serif;
  margin: 20px;
  background-color: #fafafa;
}

h1, h2 {
  color: #333;
}

#shops-container {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
  margin-bottom: 30px;
}

.shop {
  border: 1px solid #ccc;
  padding: 10px;
  border-radius: 8px;
  width: 200px;
  background-color: #fff;
}

.low-stock {
  background-color: #ffdddd;
}

#notifications {
  margin-top: 20px;
  padding: 10px;
  border: 1px solid #aaa;
  background-color: #fff8dc;
  border-radius: 8px;
}

form {
  margin-bottom: 30px;
}
    </style>
    
</head>
<body>
<h1>Retail Shops Inventory & Payment System</h1>

<div id="shops-container"></div>

<h2>Purchase Item</h2>
<form id="purchaseForm" onsubmit="processPurchase(event)">
  <label for="shopSelect">Select Shop:</label>
  <select id="shopSelect" required></select><br/><br/>
  <label for="itemSelect">Select Item:</label>
  <select id="itemSelect" required></select><br/><br/>
  <label for="quantity">Quantity:</label>
  <input type="number" id="quantity" min="1" required /><br/><br/>
  <button type="submit">Buy & Pay</button>
</form>

<div id="notifications"></div>

</body>
</html>
